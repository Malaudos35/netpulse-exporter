services:
  netpulse-exporter:
    build: ./exporter
    container_name: netpulse-exporter
    restart: unless-stopped
    environment:
      # Hôtes à pinger, séparés par des virgules
      # 1.1.1.1 et 8.8.8.8 = internet en général
      # ajoute l'IP de ta Freebox (ex: 192.168.1.254) pour voir si le souci vient du LAN ou du WAN
      PING_HOSTS: "1.1.1.1,8.8.8.8,192.168.1.254"
      PING_INTERVAL: "15"
      SPEEDTEST_INTERVAL: "30"
      EXPORTER_PORT: "8000"
      # URL de ton serveur LibreSpeed self-hosted (à définir dans un fichier .env, voir README)
      LIBRESPEED_SERVER_URL: "${LIBRESPEED_SERVER_URL}"
      LIBRESPEED_SERVER_NAME: "${LIBRESPEED_SERVER_NAME:-self-hosted}"
      # à adapter uniquement si ton installation LibreSpeed utilise des chemins non standards
      LIBRESPEED_DL_PATH: "${LIBRESPEED_DL_PATH:-backend/garbage.php}"
      LIBRESPEED_UL_PATH: "${LIBRESPEED_UL_PATH:-backend/empty.php}"
      LIBRESPEED_PING_PATH: "${LIBRESPEED_PING_PATH:-backend/empty.php}"
      LIBRESPEED_GETIP_PATH: "${LIBRESPEED_GETIP_PATH:-backend/getIP.php}"
    ports:
      - "8000:8000"   # utile pour vérifier /metrics manuellement

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
    depends_on:
      - netpulse-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  prometheus-data:
  grafana-data: